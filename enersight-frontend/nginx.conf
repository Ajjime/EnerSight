# Serves the built Vite bundle.
#
# The frontend talks to the API directly at http://<page hostname>:8000 (see
# src/config.js), so nothing is proxied through here. If that ever changes to a
# same-origin /api path, add the proxy_pass block rather than hardcoding a host
# into the bundle at build time - the current arrangement is what lets the same
# build work from a laptop and from a phone on the same network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints asset filenames, so they can be cached hard. index.html
    # must not be, or a returning visitor keeps booting the previous build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Leaflet and Recharts make the main bundle large; without this the default
    # 1m body limit is fine but the proxy buffers are not generous enough for the
    # OCR photo uploads if a proxy is ever added above.
    client_max_body_size 16m;
}
